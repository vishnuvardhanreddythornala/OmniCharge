<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OmniCharge — Instant Mobile Recharge</title>
  <meta name="description" content="Recharge any mobile number instantly. Browse plans, detect operators automatically, and pay securely with Razorpay.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#FCFCFB">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts: Inter (body) + Outfit (display) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN (lightweight icon set) -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Razorpay Checkout Script — Loaded early for payment flow -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

  <!-- Google Identity Services — For Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-surface text-surface-900 antialiased">
  <app-root>
    <style>
      .global-app-loader {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; width: 100vw; background: #FCFCFB; color: #1F2937; font-family: 'Outfit', sans-serif;
      }
      .global-app-loader-icon {
        width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg, #C65D3B, #e06f5c);
        display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; color: white;
        animation: pulse 1.5s infinite; margin-bottom: 24px; box-shadow: 0 0 40px rgba(198, 93, 59, 0.4);
      }
      .global-app-loader-bars { display: flex; gap: 8px; }
      .global-app-loader-bar {
        width: 4px; height: 16px; background: #e06f5c; border-radius: 4px;
        animation: bounce 1.2s infinite ease-in-out;
      }
      .global-app-loader-bar:nth-child(1) { animation-delay: -0.24s; }
      .global-app-loader-bar:nth-child(2) { animation-delay: -0.12s; }
      @keyframes bounce { 0%, 80%, 100% { transform: scaleY(0.4); opacity: 0.5; } 40% { transform: scaleY(1); opacity: 1; } }
      @keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(198, 93, 59, 0.4); } 50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(198, 93, 59, 0.6); } }
    </style>
    <div class="global-app-loader">
      <div class="global-app-loader-icon">⚡</div>
      <div class="global-app-loader-bars">
        <div class="global-app-loader-bar"></div>
        <div class="global-app-loader-bar"></div>
        <div class="global-app-loader-bar"></div>
      </div>
    </div>
  </app-root>
</body>
</html>
