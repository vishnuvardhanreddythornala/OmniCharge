global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "omnicharge-services"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: api-gateway

      - targets: ["user-service:8081"]
        labels:
          service: user-service

      - targets: ["operator-service:8082"]
        labels:
          service: operator-service

      - targets: ["recharge-service:8083"]
        labels:
          service: recharge-service

      - targets: ["payment-service:8084"]
        labels:
          service: payment-service

      - targets: ["notification-service:8085"]
        labels:
          service: notification-service

      - targets: ["logging-service:8086"]
        labels:
          service: logging-service

  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']
