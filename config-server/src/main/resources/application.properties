server.port=8888
spring.application.name=config-server

# Config Server Local Profile
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./config-repo

# Eureka Client - register config-server with Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=false

# RabbitMQ for Spring Cloud Bus
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Health check - exclude discovery client from health indicator
# so config-server doesn't go DOWN if eureka is temporarily unreachable
management.health.discovery.enabled=false
