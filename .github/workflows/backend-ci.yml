name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'user-service/**'
      - 'operator-service/**'
      - 'recharge-service/**'
      - 'payment-service/**'
      - 'notification-service/**'
      - 'api-gateway/**'
      - 'eureka-server/**'
      - 'config-server/**'
      - 'pom.xml'
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [
          'user-service',
          'operator-service',
          'recharge-service',
          'payment-service',
          'notification-service',
          'api-gateway',
          'eureka-server',
          'config-server'
        ]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test ${{ matrix.service }}
      run: mvn -B test --file ${{ matrix.service }}/pom.xml

  sonarcloud:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: SonarCloud Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.token=${SONAR_TOKEN}
