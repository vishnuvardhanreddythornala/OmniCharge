name: Frontend CI/CD (GitHub Pages)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'omnicharge-ui/**'
      - '.github/workflows/frontend-ci-cd.yml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'omnicharge-ui/package-lock.json'
          
      - name: Install dependencies
        working-directory: ./omnicharge-ui
        run: npm ci
        
      - name: Build Angular for GitHub Pages
        working-directory: ./omnicharge-ui
        # The base-href MUST match the repository name for GitHub Pages to load assets correctly
        run: npm run build -- --configuration production --base-href /OmniCharge/
        
      - name: Fix Routing for GitHub Pages
        working-directory: ./omnicharge-ui/dist/omnicharge-ui/browser
        run: cp index.html 404.html
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the compiled Angular dist folder
          path: './omnicharge-ui/dist/omnicharge-ui/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
